<text x="450.0" y="22" fill="#a6adc8" text-anchor="middle" font-size="12">bash — ecotech-inventory</text>
<text x="18" y="58" fill="#a6e3a1" xml:space="preserve">$ npm create vite@latest ecotech-inventory -- --template react-ts</text>
<text x="18" y="78" fill="#a6e3a1" xml:space="preserve">$ cd ecotech-inventory &amp;&amp; npm install &amp;&amp; npm install @supabase/supabase-js</text>
<text x="18" y="98" fill="#a6e3a1" xml:space="preserve">$ rm -rf src/assets/* src/App.css public/icons.svg</text>
<text x="18" y="118" fill="#a6e3a1" xml:space="preserve">$ mkdir -p src/{assets,components/{ui,layout,inventory},pages,hooks,context,services/supabase,types,utils,config}</text>
